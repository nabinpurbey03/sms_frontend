# ==============================================================================
# SSUP Frontend — Production Nginx Configuration (Unprivileged Non-Root)
# ==============================================================================
# Loaded as /etc/nginx/conf.d/default.conf inside nginx-unprivileged.
# Only server-level directives belong here; http-level defaults like
# sendfile, tcp_nopush, tcp_nodelay, keepalive_timeout are already set
# by the base image's /etc/nginx/nginx.conf.
# ==============================================================================

server {
    # Disable server version disclosure
    server_tokens off;

    # Allow larger uploads (school logos, report cards, etc.)
    client_max_body_size 25M;

    # --------------------------------------------------------------------------
    # Gzip Compression
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Listen on unprivileged port 8080 (standard for non-root containers)
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker internal DNS resolver with 30s TTL
    # Using dynamic resolution prevents Nginx from crashing if backend is starting up
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream "http://app:8000";

    # --------------------------------------------------------------------------
    # Security Headers (OWASP Baseline)
    # --------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # --------------------------------------------------------------------------
    # Healthcheck Probe (used by Docker Compose / Kubernetes / Load Balancer)
    # --------------------------------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'healthy\n';
    }

    # --------------------------------------------------------------------------
    # Reverse Proxy to Backend API (Eliminates CORS in Production)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_connect_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # Reverse Proxy for Uploaded Media (School Logos & Report Card PDFs)
    # --------------------------------------------------------------------------
    location /uploads/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # --------------------------------------------------------------------------
    # Static Assets with Content Hashes (Vite /assets/*)
    # Cache immutably for 1 year; browsers never re-fetch until code changes
    # --------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Favicon, SVGs, and root static images (cache for 7 days)
    location ~* \.(?:ico|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Entry Point (index.html)
    # NEVER cache index.html so users always receive new chunk hashes on deploy
    # --------------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # --------------------------------------------------------------------------
    # SPA Client-Side Routing Fallback (TanStack Router)
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
